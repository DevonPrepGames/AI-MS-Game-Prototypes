<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Games Showcase | Devon Prep</title>
  <meta name="description" content="Play and rate games built by Devon Prep technology students.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">


  <style>
    :root {
      --navy: #13284f;
      --navy-deep: #0b1a36;
      --gold: #c9a227;
      --gold-soft: #f3e7bf;
      --paper: #ffffff;
      --surface: #eef1f6;
      --line: #d6dce7;
      --ink: #1a2233;
      --muted: #5a6680;
      --serif: 'Libre Caslon Text', Georgia, serif;
      --sans: 'Public Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--surface);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

    /* ---------- Masthead ---------- */
    .masthead {
      background: var(--navy);
      color: #fff;
      border-bottom: 6px solid var(--gold);
    }

    .masthead-top {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 0 0;
    }

    .crest {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      display: grid; place-items: center;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1rem;
      color: var(--gold);
      flex-shrink: 0;
    }

    .school-name {
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      color: #dbe3f2;
    }

    .school-name small {
      display: block;
      font-family: var(--sans);
      font-size: 0.8rem;
      color: #9fb0cf;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 32px;
      align-items: end;
      padding: 48px 0 40px;
    }

    .hero h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.2rem, 5.5vw, 3.75rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      max-width: 14ch;
    }

    .hero p {
      margin-top: 16px;
      color: #c8d3e8;
      font-size: 1.05rem;
      max-width: 52ch;
    }

    .hero-stats {
      display: flex;
      gap: 28px;
      padding-bottom: 6px;
    }

    .hero-stats div { text-align: right; }

    .hero-stats strong {
      display: block;
      font-family: var(--serif);
      font-weight: 400;
      font-size: 2.4rem;
      line-height: 1;
      color: var(--gold);
    }

    .hero-stats span { font-size: 0.85rem; color: #9fb0cf; }

    /* Course tabs sit on the gold rule */
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      font: 600 0.92rem var(--sans);
      color: #c8d3e8;
      background: transparent;
      border: none;
      padding: 12px 18px 14px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
    }

    .tab:hover { color: #fff; background: rgba(255,255,255,0.06); }

    .tab[aria-selected="true"] { background: var(--gold); color: var(--navy-deep); }

    .tab .count { font-weight: 500; opacity: 0.7; margin-left: 4px; }

    /* ---------- Toolbar ---------- */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 28px 0 8px;
    }

    .search {
      flex: 1 1 280px;
      position: relative;
    }

    .search svg {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--muted);
    }

    .search input, .sort select {
      width: 100%;
      font: 500 1rem var(--sans);
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 14px;
    }

    .search input { padding-left: 42px; }
    .search input:focus, .sort select:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px var(--gold-soft); }

    .sort { display: flex; align-items: center; gap: 8px; }
    .sort label { font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
    .sort select { width: auto; cursor: pointer; }

    .result-note { font-size: 0.9rem; color: var(--muted); padding-bottom: 8px; }

    /* ---------- Gallery ---------- */
    main { padding-bottom: 72px; }

    .group { margin-top: 32px; }

    .group-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 18px;
      border-bottom: 2px solid var(--navy);
    }

    .group-head h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--navy);
    }

    .group-head span { color: var(--muted); font-size: 0.9rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(270px, 100%), 1fr));
      gap: 16px;
    }

    .game {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .game-who { display: flex; gap: 12px; align-items: center; }

    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--gold);
      display: grid; place-items: center;
      font: 700 0.85rem var(--sans);
      flex-shrink: 0;
    }

    .student { font-weight: 600; font-size: 0.95rem; }
    .course { font-size: 0.82rem; color: var(--muted); }

    .game h3 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.3rem;
      line-height: 1.25;
      color: var(--navy-deep);
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .avg { display: flex; align-items: center; gap: 6px; }
    .avg b { color: var(--ink); font-weight: 700; }

    .stars { display: inline-flex; gap: 2px; }
    .stars button {
      background: none; border: none; padding: 2px;
      cursor: pointer; line-height: 0;
      color: var(--line);
    }
    .stars svg { width: 20px; height: 20px; fill: currentColor; }
    .stars button.on { color: var(--gold); }
    .stars:not(.locked):hover button { color: var(--gold); }
    .stars:not(.locked) button:hover ~ button { color: var(--line); }
    .stars.locked button { cursor: default; }

    .rate-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--muted); }

    .play {
      display: block;
      text-align: center;
      font: 700 0.95rem var(--sans);
      color: #fff;
      background: var(--navy);
      text-decoration: none;
      padding: 11px;
      border-radius: 8px;
    }
    .play:hover { background: var(--navy-deep); }
    .play.soon { background: var(--surface); color: var(--muted); cursor: default; }

    .empty {
      text-align: center;
      padding: 64px 0;
      color: var(--muted);
    }
    .empty button {
      margin-top: 12px;
      font: 600 0.95rem var(--sans);
      color: var(--navy);
      background: none;
      border: 1px solid var(--navy);
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
    }

    footer {
      background: var(--navy-deep);
      color: #9fb0cf;
      font-size: 0.85rem;
      padding: 24px 0;
    }

    @media (max-width: 720px) {
      .wrap { padding: 0 16px; }
      .hero { grid-template-columns: 1fr; padding: 32px 0 28px; gap: 20px; }
      .hero-stats div { text-align: left; }
      .sort { width: 100%; }
      .sort select { flex: 1; }
    }
  </style>
</head>
<body>

  <header class="masthead">
    <div class="wrap">
      <div class="masthead-top">
        <div class="crest" aria-hidden="true">DP</div>
        <div class="school-name">Devon Preparatory School<small>Technology Department</small></div>
      </div>

      <div class="hero">
        <div>
          <h1>Student Games Showcase</h1>
          <p>Every game here was designed and built by a Devon Prep student using AI tools. Pick one, play it, and leave a rating.</p>
        </div>
        <div class="hero-stats">
          <div><strong id="statGames">0</strong><span>games</span></div>
          <div><strong id="statPlays">0</strong><span>plays</span></div>
          <div><strong id="statRatings">0</strong><span>ratings</span></div>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Filter by course" id="tabs"></nav>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search by student or game" aria-label="Search by student or game">
      </div>
      <div class="sort">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="course">Course</option>
          <option value="rating">Highest rated</option>
          <option value="plays">Most played</option>
          <option value="title">Game title, A to Z</option>
          <option value="student">Student name, A to Z</option>
        </select>
      </div>
    </div>
    <p class="result-note" id="resultNote" aria-live="polite"></p>
  </div>

  <main class="wrap" id="gallery"></main>

  <footer>
    <div class="wrap">Devon Preparatory School, Technology Department. Games open in a new tab.</div>
  </footer>

  <script>
    // -------------------------------------------------------------
    // 1. SETTINGS
    // CATALOG_URL: the list of courses and games (data/games.json).
    // STATS_ENDPOINT: paste the Web app URL from your Google Apps Script
    // deployment (see README.md). Leave it empty and the gallery works
    // normally, but plays and ratings aren't recorded.
    // -------------------------------------------------------------
    const CATALOG_URL = 'data/games.json';
    const STATS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwRaKFVWpufpSu96GAI2PnejZXaURx70SZgCiZgGHPGNCtkG4Gx-o6QxbQ0hmMK4a85/exec';

    // -------------------------------------------------------------
    // 2. CATALOG
    // Loaded from data/games.json when the page opens. Edit the Games tab
    // in games.xlsx, then run tools/xlsx_to_json.py to refresh the file.
    // Links ending in /edit are Google Sites EDITOR links: only the student
    // (and collaborators) can open them. Swap in the published link.
    // Games with an empty url show "Link coming soon".
    // -------------------------------------------------------------
    let COURSES = [];
    let GAMES = [];

    // -------------------------------------------------------------
    // 3. STATE AND HELPERS
    // -------------------------------------------------------------
    const state = { course: 'all', query: '', sort: 'course' };
    let stats = {};

    const RATED_KEY = 'dpShowcaseRated';
    const getRated = () => { try { return JSON.parse(localStorage.getItem(RATED_KEY)) || {}; } catch { return {}; } };
    const saveRated = (id, n) => {
      try { const r = getRated(); r[id] = n; localStorage.setItem(RATED_KEY, JSON.stringify(r)); } catch {}
    };

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const courseName = key => (COURSES.find(c => c.key === key) || {}).name || key;
    const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
    const statFor = id => stats[id] || {};
    const avgFor = id => { const s = statFor(id); return s.ratingCount ? s.ratingTotal / s.ratingCount : 0; };

    const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';

    // -------------------------------------------------------------
    // 4. RENDERING
    // -------------------------------------------------------------
    function renderTabs() {
      const all = [{ key: 'all', name: 'All courses', n: GAMES.length }]
        .concat(COURSES.map(c => ({ ...c, n: GAMES.filter(g => g.section === c.key).length })));
      document.getElementById('tabs').innerHTML = all.map(t => `
        <button class="tab" role="tab" aria-selected="${state.course === t.key}" data-course="${esc(t.key)}">
          ${esc(t.name)}<span class="count">${t.n}</span>
        </button>`).join('');
    }

    function renderStats() {
      let plays = 0, ratings = 0;
      Object.values(stats).forEach(s => { plays += s.views || 0; ratings += s.ratingCount || 0; });
      document.getElementById('statGames').textContent = GAMES.length;
      document.getElementById('statPlays').textContent = plays.toLocaleString();
      document.getElementById('statRatings').textContent = ratings.toLocaleString();
    }

    function card(game, showCourse) {
      const s = statFor(game.id);
      const avg = avgFor(game.id);
      const mine = getRated()[game.id] || 0;
      const locked = mine > 0;

      const stars = [1, 2, 3, 4, 5].map(n => `
        <button type="button" class="${n <= mine ? 'on' : ''}" data-rate="${game.id}" data-stars="${n}"
          aria-label="Rate ${n} star${n > 1 ? 's' : ''}" ${locked ? 'disabled' : ''}>${STAR}</button>`).join('');

      const play = game.url
        ? `<a class="play" href="${esc(game.url)}" target="_blank" rel="noopener" data-play="${game.id}">Play ${esc(game.title)}</a>`
        : `<span class="play soon">Link coming soon</span>`;

      return `
        <article class="game">
          <div class="game-who">
            <div class="avatar" aria-hidden="true">${esc(initials(game.student))}</div>
            <div>
              <div class="student">${esc(game.student)}</div>
              ${showCourse ? `<div class="course">${esc(courseName(game.section))}</div>` : ''}
            </div>
          </div>
          <h3>${esc(game.title)}</h3>
          <div class="game-stats">
            <span class="avg">${s.ratingCount ? `<b>${avg.toFixed(1)}</b> average from ${s.ratingCount}` : 'Not rated yet'}</span>
            <span>${(s.views || 0).toLocaleString()} ${s.views === 1 ? 'play' : 'plays'}</span>
          </div>
          <div class="rate-row">
            <span>${locked ? 'Your rating' : 'Rate this game'}</span>
            <span class="stars ${locked ? 'locked' : ''}">${stars}</span>
          </div>
          ${play}
        </article>`;
    }

    function sorted(list) {
      const by = {
        rating:  (a, b) => avgFor(b.id) - avgFor(a.id) || (statFor(b.id).ratingCount || 0) - (statFor(a.id).ratingCount || 0),
        plays:   (a, b) => (statFor(b.id).views || 0) - (statFor(a.id).views || 0),
        title:   (a, b) => a.title.localeCompare(b.title),
        student: (a, b) => a.student.localeCompare(b.student)
      }[state.sort];
      return by ? [...list].sort(by) : list;
    }

    function renderGallery() {
      const q = state.query.trim().toLowerCase();
      const list = GAMES.filter(g =>
        (state.course === 'all' || g.section === state.course) &&
        (!q || g.student.toLowerCase().includes(q) || g.title.toLowerCase().includes(q))
      );

      const gallery = document.getElementById('gallery');
      const note = document.getElementById('resultNote');

      if (!list.length) {
        note.textContent = '';
        gallery.innerHTML = `
          <div class="empty">
            <p>No games match "${esc(state.query)}".</p>
            <button type="button" id="clearSearch">Clear search</button>
          </div>`;
        return;
      }

      note.textContent = q ? `${list.length} ${list.length === 1 ? 'game matches' : 'games match'} "${state.query.trim()}"` : '';

      // Grouped by course when sorting by course; one flat grid otherwise
      if (state.sort === 'course') {
        gallery.innerHTML = COURSES
          .map(c => ({ c, games: list.filter(g => g.section === c.key) }))
          .filter(g => g.games.length)
          .map(({ c, games }) => `
            <section class="group" aria-label="${esc(c.name)}">
              <div class="group-head"><h2>${esc(c.name)}</h2><span>${games.length} ${games.length === 1 ? 'game' : 'games'}</span></div>
              <div class="grid">${games.map(g => card(g, false)).join('')}</div>
            </section>`).join('');
      } else {
        gallery.innerHTML = `<div class="grid group">${sorted(list).map(g => card(g, true)).join('')}</div>`;
      }
    }

    function renderAll() { renderTabs(); renderStats(); renderGallery(); }

    // -------------------------------------------------------------
    // 5. PLAYS AND RATINGS (saved to Google Sheets through Apps Script)
    // -------------------------------------------------------------
    function post(payload) {
      if (!STATS_ENDPOINT) return;
      try {
        fetch(STATS_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          keepalive: true,
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      } catch (err) { console.warn('Could not send stats:', err); }
    }

    function bump(id, fn) {
      const s = stats[id] = Object.assign({ views: 0, ratingTotal: 0, ratingCount: 0 }, stats[id]);
      fn(s);
    }

    function recordPlay(id) {
      post({ type: 'play', id });
      bump(id, s => { s.views += 1; });
      renderStats();
      setTimeout(renderGallery, 300);
    }

    function rateGame(id, n) {
      if (getRated()[id]) return;
      saveRated(id, n);
      post({ type: 'rating', id, stars: n });
      bump(id, s => { s.ratingTotal += n; s.ratingCount += 1; });
      renderStats();
      renderGallery();
    }

    async function loadStats() {
      if (!STATS_ENDPOINT) return;
      try {
        const res = await fetch(STATS_ENDPOINT);
        const data = await res.json();
        if (data && typeof data === 'object') { stats = data; renderStats(); renderGallery(); }
      } catch (err) { console.warn('Could not load stats:', err); }
    }

    // -------------------------------------------------------------
    // 6. EVENTS
    // -------------------------------------------------------------
    document.getElementById('tabs').addEventListener('click', e => {
      const t = e.target.closest('[data-course]');
      if (!t) return;
      state.course = t.dataset.course;
      renderTabs();
      renderGallery();
    });

    document.getElementById('search').addEventListener('input', e => { state.query = e.target.value; renderGallery(); });
    document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; renderGallery(); });

    document.getElementById('gallery').addEventListener('click', e => {
      const rate = e.target.closest('[data-rate]');
      if (rate) return rateGame(rate.dataset.rate, Number(rate.dataset.stars));
      const play = e.target.closest('[data-play]');
      if (play) return recordPlay(play.dataset.play);
      if (e.target.id === 'clearSearch') {
        state.query = '';
        document.getElementById('search').value = '';
        renderGallery();
      }
    });

    async function init() {
      try {
        const res = await fetch(CATALOG_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        COURSES = data.courses || [];
        GAMES = data.games || [];
      } catch (err) {
        console.error('Could not load the game catalog:', err);
        document.getElementById('gallery').innerHTML =
          '<p style="padding:48px 0;text-align:center;color:var(--muted)">The game list could not be loaded. If you opened this file directly from your computer, view it through GitHub Pages or a local web server instead.</p>';
        return;
      }
      renderAll();
      loadStats();
    }

    init();
  </script>
</body>
</html>
